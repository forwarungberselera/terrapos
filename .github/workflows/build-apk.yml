name: Build Android APK (Capacitor)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Web Dependencies
        run: |
          cd web
          npm ci

      - name: Patch @capacitor/android Java version to 17
        run: |
          cd web
          find node_modules/@capacitor/android -name "*.gradle" 2>/dev/null | while read f; do
            sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' "$f"
          done

      - name: Build Web Static Export & Sync Capacitor
        run: |
          cd web
          NEXT_OUTPUT=export npm run build
          npx cap sync android

      - name: Ensure Native Plugins & Config in Assets
        run: |
          cd web
          mkdir -p android/app/src/main/assets
          cat > android/app/src/main/assets/capacitor.plugins.json << 'PLUGEOF'
          [
            {
              "pkg": "com.terrapos.app.plugins.bluetooth",
              "classpath": "com.terrapos.app.plugins.bluetooth.BluetoothPrinterPlugin"
            }
          ]
          PLUGEOF

      - name: Build APK via Gradle
        run: |
          cd web/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerraPOS-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

